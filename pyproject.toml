[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mdcx*", "scripts*"]

[project]
name = "mdcx"
version = "2.6.4"
description = "mdcx"
readme = "README.md"
requires-python = ">=3.13.4" # we need os.path.ALLOW_MISSING and type parameter defaults
dependencies = [
    "aiofiles==25.1.0",  # 24.1.0 早于 3.14; 25.1.0(2025-10-09)起官方测试并支持 Python 3.14
    "aiohttp>=3.14.3",  # GHSA-mfx4-hv73-q22v 等 HTTP smuggling/解析器漏洞修复
    "aiolimiter==1.2.1",
    "av>=15.1.0",  # 15.1.0 起才提供 cp314 wheel; 15.0.0 只有 cp39~cp313, 3.14 上会退回源码编译(需 FFmpeg)
    "beautifulsoup4==4.13.4",
    "curl-cffi>=0.15.0",  # GHSA-qw2m-4pqf-rmpp (CVE-2026-33752) 重定向 SSRF 修复; 0.12 起 sentinel 更名已兼容
    "httpx[socks]>=0.28.1",
    "lxml>=6.1.0",  # GHSA-vfmq-68hx-4jfw (CVE-2026-41066) XXE 修复; 需用 defusedxml 解析不可信 XML
    "openai==1.91.0",
    "oshash==0.1.1",
    "parsel>=1.10.0",
    "pillow>=12.2.0",  # GHSA-pwv6-vv43-88gr / whj4-6x5x-4v2j / cfh3-3jmp-rvhc / r73j-pqj5-w3x7 等 12 条告警; 处理不可信封面/缩略图
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j 符号链接越权读 secrets
    "pyqt6==6.11.0",
    "tenacity>=9.0.0",  # 爬虫重试/退避统一（cf_bypass 浏览器后端等）；纯 Python 无二进制依赖
    "zhconv==1.4.3",
    "opencv-contrib-python-headless==4.13.0.92",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
    # --- 外部CF服务适配层依赖 (TRAWL/FlareSolverr 协议翻译) ---
    # 内置 CF Bypass (cloakbrowser + cf_bypasser) 已移除, 过 CF 统一走外部服务。
    "uvicorn>=0.15.0",
]

[project.optional-dependencies]
# 浏览器 CF bypass 后端：Playwright + 系统 Edge（msedge 通道，免下浏览器包）。
# selenium 仍走首次使用自动安装；本 extra 供打包/预装：pip install mdcx[browser]
browser = [
    "playwright>=1.49.0",
]

[project.scripts]
crawl = "mdcx.cmd.crawl:app"
gen_enums = "mdcx.cmd.gen_enums:main"
build = "scripts.build:main"
bump = "scripts.bump:app"
changelog = "scripts.changelog:app"
check = "scripts.check:main"
quick-check = "scripts.quick_check:main"
dmm-probe = "scripts.dmm_prefix_probe:main"

[dependency-groups]
dev = [
    "altgraph>=0.17.5",   # 0.17.4 引入 pkg_resources(已从 setuptools 83 移除), 0.17.5 修复
    "ipykernel>=6.30.1",
    "numpy>=2.4.3",
    "opencv-contrib-python-headless>=4.13.0.92",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.16.0,<7",  # 6.14.2 的 requires-python 是 <3.14, 在 3.14 上直接装不上; 6.16.0 起支持 3.14
    "pyright>=1.1.400",
    "pytest>=9.0.3",  # GHSA-6w46-j5rx-g56g tmpdir 处理漏洞 (dev)
    "tornado>=6.5.8",  # GHSA-8423-8fgw-73vq / mpf4-983q-p7j4 / wwv5-g3v4-889x (ipykernel 传递依赖)
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",  # httpx 传输层 mock：替代手写 FakeAsyncClient（tests/test_emby_respx.py 示例）
    "rich>=14.1.0",
    "ruff>=0.17.1,<0.18.0",
    "typer>=0.16.0",
    "types-lxml>=2025.3.30",
    "mypy>=1.17.0",
]

[tool.pytest.ini_options]
# P2 测试质量专项：声明自定义 marker，使 CI 可用 `-m "not network and not integration"`
# 跑通单元子集，真实网络/线上站点测试默认跳过。
markers = [
    "network: 需要真实网络访问的测试（CI 默认跳过）",
    "integration: 针对线上外部站点/服务的集成测试（CI 默认跳过）",
]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pyright]
typeCheckingMode = "off"
include = ["mdcx"]
exclude = [
    "**/__pycache__",
    "mdcx/controllers/main_window/init.py",
    "mdcx/controllers/main_window/load_config.py",
    "mdcx/views",
    "mdcx/gen",
]
pythonVersion = "3.13"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"
reportMissingParameterType = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportPrivateUsage = "none"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_no_return = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "mdcx/controllers/main_window/init\\.py",
    "mdcx/controllers/main_window/load_config\\.py",
    "mdcx/views/",
    "mdcx/gen/",
    "mdcx/cf_bypass/",
    "mdcx/tools/minnano_crawler\\.py",
    "mdcx/tools/wiki\\.py",
    "mdcx/tools/missing\\.py",
    "mdcx/core/amazon\\.py",
    "mdcx/core/network_check\\.py",
    "mdcx/core/tmdb_actor\\.py",
    "mdcx/core/translate\\.py",
    "mdcx/controllers/main_window/site_priority_dialog\\.py",
    "tests/",
]

# 上面 exclude 里的这些模块，exclude 规则本身管不到：mypy 的 exclude 只作用于
# 「递归发现」这条路径，模块一旦被别的模块 import 进来就会被重新检查。
# 它们在被引用时同样看不到兄弟 mixin / 动态挂载的属性，刷出来的全是 GUI 装配噪音，
# 与 exclude 的意图一致，这里补 ignore_errors 让排除在两条路径下都真正生效
# （CI 用的是同一份 pyproject.toml，无平台差异）。
[[tool.mypy.overrides]]
ignore_errors = true
module = [
    "mdcx.views.*",
    "mdcx.controllers.main_window.init",
    "mdcx.core.network_check",
]

# 主窗口已按职责拆成 29 个 mixin/helper 模块（与 init.py / load_config.py 同属纯 GUI 装配代码）。
# 每个模块被 mypy 单独分析时看不到兄弟 mixin 与 __init__ 上定义的属性，
# 只会刷出 self.xxx 的 attr-defined 噪音，因此整组忽略其内部报错。
# nfo_library 是同一族的 helper 模块（以 self: MyMAinWindow 形式访问懒建属性）。
[[tool.mypy.overrides]]
ignore_errors = true
module = [
    "mdcx.controllers.main_window.actor_db",
    "mdcx.controllers.main_window.actor_info",
    "mdcx.controllers.main_window.auto_scrape",
    "mdcx.controllers.main_window.cookie_checks",
    "mdcx.controllers.main_window.dock_layout",
    "mdcx.controllers.main_window.folder_select",
    "mdcx.controllers.main_window.layout_actor",
    "mdcx.controllers.main_window.layout_download",
    "mdcx.controllers.main_window.layout_master",
    "mdcx.controllers.main_window.layout_nfo_overlay",
    "mdcx.controllers.main_window.layout_nfo_page",
    "mdcx.controllers.main_window.layout_settings",
    "mdcx.controllers.main_window.layout_text_groups",
    "mdcx.controllers.main_window.logs",
    "mdcx.controllers.main_window.navigation",
    "mdcx.controllers.main_window.net_check",
    "mdcx.controllers.main_window.nfo_editor",
    "mdcx.controllers.main_window.nfo_lib_layout",
    "mdcx.controllers.main_window.nfo_library",
    "mdcx.controllers.main_window.nfo_library_handlers",
    "mdcx.controllers.main_window.result_actions",
    "mdcx.controllers.main_window.result_tree",
    "mdcx.controllers.main_window.scrape_cache",
    "mdcx.controllers.main_window.scrape_control",
    "mdcx.controllers.main_window.settings_actions",
    "mdcx.controllers.main_window.success_list",
    "mdcx.controllers.main_window.tips",
    "mdcx.controllers.main_window.tool_page",
    "mdcx.controllers.main_window.window_ops",
]
