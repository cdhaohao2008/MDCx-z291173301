name: Build and Release Python3.15

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 显式锁定 3.15：仓库无 .python-version，UV_PYTHON 兜住 setup-python 之外的 uv 调用
  UV_PYTHON: "3.15"
  # PyYAML 没有 cp315 wheel（见文件头说明）：置 0 让它跳过 `yaml._yaml` C 扩展，
  # 直接从 sdist 产出纯 Python wheel（py3-none-any），三平台都不需要编译器链。
  PYYAML_FORCE_LIBYAML: "0"
  # 依赖统一在「Install locked dependencies」里显式 sync 一次，之后所有 uv run 都不再
  # 隐式同步（隐式 sync 每次 uv run 都会重新解析，可能重建 pyyaml，拖慢构建）。
  UV_NO_SYNC: "1"

permissions:
  # 发 Release 需要 contents: write。job 级权限声明会覆盖默认的 issues/pull-requests，
  # 这里只开 contents 一个，避免给多余令牌权限。
  contents: write

on:
  push:
    tags:
      - "2*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 / Tag（留空则自动取 consts.py 的 LOCAL_VERSION，必须为纯数字；也可手动填写）"
        required: false
        default: ""
      prerelease:
        description: "是否作为预发布（pre-release）"
        required: false
        default: "false"

concurrency:
  # 同一分支/同一 tag 的多个 run 排队执行，不取消正在构建/上传的 run
  # （半路取消会留下缺资产的 Release）。
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # https://github.com/actions/runner/issues/1985#issuecomment-1573518052
      - name: Set matrix
        id: set-matrix
        run: |
          items=()

          # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners

          # macOS 只剩 Apple Silicon 一条腿：macOS 已放弃 x86_64（Intel runner 2027 秋整体
          # 退役），再编一份 x86_64 dmg 只是白烧 runner 时间。
          items+=('{"build": "macos", "os": "macos-latest", "arch": "aarch64"}')
          items+=('{"build": "windows", "os": "windows-2025", "arch": "x86_64"}')
          items+=('{"build": "linux", "os": "ubuntu-latest", "arch": "x86_64"}')

          # 合并items到json数组
          matrix="matrix=["
          for ((i=0; i<${#items[@]}; i++)); do
            matrix+=" ${items[i]}"
            if ((i != ${#items[@]}-1)); then
              matrix+=","
            fi
          done
          matrix+="]"

          # 输出matrix到GITHUB_OUTPUT
          echo $matrix >> $GITHUB_OUTPUT

  build-app:
    needs: init-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 某个平台 runner/依赖突然翻车时不阻塞其余平台，且 publish-release 会因
    # needs.build-app.result != 'success' 而跳过发版，不会把残缺产物发成 Release。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.init-matrix.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="$DISPATCH_TAG"
          if [ -z "$tag" ] && [ -n "$REF_TAG" ] && [ "$REF_TAG" != "main" ]; then tag="$REF_TAG"; fi
          # 手动触发且没有事件版本时，取 consts.py 的 LOCAL_VERSION。
          if [ -z "$tag" ]; then
            tag=$(grep -oE 'LOCAL_VERSION[[:space:]]*=[[:space:]]*[0-9]+' mdcx/consts.py | grep -oE '[0-9]+')
          fi

          # tag 必须是纯数字(供 check_version 的 int(tag_name) 使用)，
          # 非数字(如 v2.0.0)会导致自动更新永久失效。填错直接报错退出, 避免建出破坏性 release。
          if ! [[ "$tag" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tag 必须是纯数字 YYYYMMDD（供 check_version 的 int(tag) 使用）, 当前为 '$tag'。请检查 mdcx/consts.py 的 LOCAL_VERSION 或手动输入。"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "Set up Python 3.15"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          activate-environment: true

      # 3.15 构建最容易被忽略的坑：uv 悄悄挑了别的解释器，编出来的还是 3.14。
      # 用 PATH 上的 python 断言（不能用 uv run：那会先隐式 sync，把下面 --locked 的严格性架空）。
      - name: Verify Python 3.15 in use
        shell: bash
        run: |
          python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 15), f"expected 3.15, got {sys.version_info[:2]}"'

      - name: Install Linux system dependencies
        if: ${{ matrix.build == 'linux' }}
        run: >
          sudo apt-get update -y && sudo apt-get install -y
          libglib2.0-0 libegl1 libgl1 libfontconfig1
          libqt6core6 libqt6gui6 libqt6widgets6 libqt6network6 libqt6xml6
          libdbus-1-3 libxkbcommon0 libopengl0
          libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
          pkg-config libavformat-dev libavcodec-dev libavdevice-dev
          libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
          libxml2-dev libxslt1-dev libxslt-dev python3-dev zlib1g-dev gcc

      # 3.15 特有的两处兼容处理：
      #   1. `uv sync --locked` 失败时回退重新解析（只影响本次 CI 的临时工作树，
      #      检出为干净树，不改仓库 uv.lock）——写死版本若无 cp315 wheel 仍会失败，
      #      那属于需要升级依赖的硬阻塞（见 tests/test_py314_dependency_floors.py）；
      #   2. PyYAML 至今没有 cp315 wheel（6.0.3 只发到 cp314），3.15 下只能从 sdist 装。
      #      工作流级 `PYYAML_FORCE_LIBYAML=0` 让它跳过 `yaml._yaml` C 扩展，直接产出
      #      纯 Python wheel（py3-none-any），不需要编译器；`_yaml` 只是可选的 C 加速，
      #      缺它时 PyYAML 自动退回纯 Python 实现，功能一致。
      #      等 PyYAML 出了 cp315 wheel，把这个环境变量删掉即可。
      - name: Install locked dependencies
        shell: bash
        run: |
          if ! uv sync --locked --all-extras --dev; then
            echo "::warning::uv sync --locked 在 Python 3.15 下失败，回退到重新解析依赖。写死版本若无 cp315 wheel，仍会失败——那属于需要升级依赖的硬阻塞。"
            uv sync --all-extras --dev
          fi
          VENV_PY="$PWD/.venv/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY="$PWD/.venv/Scripts/python.exe"
          "$VENV_PY" -c "import yaml; print('pyyaml', yaml.__version__, 'libyaml', yaml.__with_libyaml__)"

      # 超分工具一体包：Windows/Linux 打包期内嵌（macOS 不内嵌，保持首次使用按需下载）。
      # 缓存由 update-sr-tools.yml 定期刷新；命中时 fetch 脚本幂等跳过下载，未命中则直接拉取。
      - name: Restore SR tools cache (Windows/Linux)
        if: ${{ matrix.build == 'windows' || matrix.build == 'linux' }}
        uses: actions/cache@v6
        with:
          path: build/sr_tools
          key: sr-tools-${{ matrix.build }}

      - name: Fetch SR tools (Windows/Linux)
        if: ${{ matrix.build == 'windows' || matrix.build == 'linux' }}
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python -m scripts.fetch_sr_tools --platform ${{ matrix.build }}

      - name: Build macOS app - macOS
        if: ${{ matrix.build == 'macos' }}
        run: |
          version="${{ steps.release-tag.outputs.tag }}"
          uv run scripts/build.py --create-dmg --version "$version" --debug
          mv dist/MDCx.dmg "dist/MDCx-${{ matrix.arch }}.dmg"

      - name: Build Windows app - Windows
        if: ${{ matrix.build == 'windows' }}
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --version "${{ steps.release-tag.outputs.tag }}" --debug

      - name: Build Linux app - Linux
        if: ${{ matrix.build == 'linux' }}
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --version "${{ steps.release-tag.outputs.tag }}" --debug

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'macos' }}
        with:
          name: mdcx-macos-${{ matrix.arch }}
          path: dist/MDCx-${{ matrix.arch }}.dmg

      - name: Pre-check Windows artifact for release upload
        if: ${{ matrix.build == 'windows' }}
        shell: pwsh
        run: |
          $releaseTag = "${{ steps.release-tag.outputs.tag }}"
          $platform = "${{ matrix.build }}"
          $arch = "${{ matrix.arch }}"
          $sha = "${{ github.sha }}"
          $artifactPath = "dist/MDCx.exe"

          # 展示版本号（VERSION_NAME 去 v 前缀），与 publish-release 的 asset_version 同源同算法。
          # 两处各算一遍而不是跨 job 传递：build-app 的 outputs 未定义，且这个值一旦算错
          # 只会让日志里的「计划发布文件名」与真正上传的名字对不上，属于可读性问题。
          $versionName = ""
          if (Test-Path -LiteralPath "mdcx/consts.py") {
            $m = Select-String -Path "mdcx/consts.py" -Pattern 'VERSION_NAME\s*=\s*"([^"]+)"' | Select-Object -First 1
            if ($m) { $versionName = $m.Matches[0].Groups[1].Value }
          }
          $versionName = $versionName.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($versionName)) { $versionName = $releaseTag }

          $expectedAssetName = "MDCx-${versionName}-${releaseTag}-${platform}-${arch}-${sha}.exe"

          Write-Host "检查发布产物：$artifactPath"
          Write-Host "计划发布文件名：$expectedAssetName"

          if (-not (Test-Path -LiteralPath $artifactPath)) {
            throw "发布产物缺失：$artifactPath，请先确认构建成功"
          }

          if ((Get-Item -LiteralPath $artifactPath).Length -le 0) {
            throw "发布产物为空文件：$artifactPath"
          }

          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw "发布 Tag 为空，无法确认上传文件名规则"
          }

          if ([string]::IsNullOrWhiteSpace($platform) -or [string]::IsNullOrWhiteSpace($arch)) {
            throw "发布平台/架构信息缺失，无法确认上传文件名规则"
          }

          if ([string]::IsNullOrWhiteSpace($expectedAssetName) -or $expectedAssetName -notlike 'MDCx-*-*') {
            throw "无法拼出资产文件名：'$expectedAssetName'"
          }

          $artifactSizeBytes = (Get-Item -LiteralPath $artifactPath).Length
          if ($artifactSizeBytes -lt 1048576) {
            Write-Warning "产物文件较小，可能异常：$artifactPath size=${artifactSizeBytes} bytes。请确认构建输出是否完整。"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'windows' }}
        with:
          name: mdcx-windows-${{ matrix.arch }}
          path: dist/MDCx.exe

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'linux' }}
        with:
          name: mdcx-linux-${{ matrix.arch }}
          path: dist/MDCx

  publish-release:
    needs: build-app
    runs-on: ubuntu-latest
    # 门禁两条：!cancelled() 而非 always()，run 被取消时不再白跑一轮发版；
    # needs.build-app.result == 'success' 核对 build-app 的真实结果（build-app 开了
    # continue-on-error，不能写 `success()`：`needs` 里任一失败腿都会让它整体跳过）。
    if: ${{ !cancelled() && needs.build-app.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$DISPATCH_TAG"
          if [ -z "$tag" ] && [ -n "$REF_TAG" ] && [ "$REF_TAG" != "main" ]; then tag="$REF_TAG"; fi
          if [ -z "$tag" ]; then
            tag=$(grep -oE 'LOCAL_VERSION[[:space:]]*=[[:space:]]*[0-9]+' mdcx/consts.py | grep -oE '[0-9]+')
          fi
          if ! [[ "$tag" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tag 必须是纯数字，当前为 '$tag'。"
            exit 1
          fi

          # 本工作流是唯一的发版路径，所以 tag 已存在只可能是「重跑」或「手动补发同版本号」：
          # 下面的 upload-release-action 会以 overwrite 更新同一条 Release 的资产，
          # 这里提示一下，避免把覆盖更新误当成新建。
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::warning::tag '$tag' 已存在，本次是覆盖更新该 Release 的资产（overwrite: true），不是新建。"
          fi

          version_name=$(grep -oE 'VERSION_NAME[[:space:]]*=[[:space:]]*"[^"]+"' mdcx/consts.py | grep -oE '"[^"]+"' | tr -d '"')

          # 展示版本号：VERSION_NAME 去掉 v 前缀（v2.7.4 → 2.7.4）。
          # 与 tag 是两回事——tag 必须纯数字（check_version 只认 tag_name.isdigit()），
          # 展示版本号只进 Release 标题与文件名，不参与任何版本比较，故不受纯数字约束。
          asset_version=${version_name#v}
          # 读不到 VERSION_NAME 时退回 tag，保证标题与文件名都不会缺一段
          asset_version=${asset_version:-$tag}

          # Release 标题（/releases 列表里显示的那一行）：`MDCx <展示版本号> (<tag>)`，
          # 例如 `MDCx 2.7.4 (20261021)`。刻意不写成 `v2.7.4 (20261021)`——列表里一排
          # `vX.Y.Z` 分不清是本项目的包，带产品名才认得出。客户端只读 tag_name，
          # `parse_release_version()` 又是用正则搜标题里的 `X.Y.Z` 段（带不带前缀都能
          # 解析出），所以标题改名不影响自动更新。
          release_name="MDCx ${asset_version} (${tag})"

          prerelease=false
          if [ "${{ github.event_name }}" ] = "workflow_dispatch" ] && [ "$DISPATCH_PRERELEASE" = "true" ]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "name=$release_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mdcx-*
          path: dist
          merge-multiple: true

      # 半成品 Release 比不发更糟（用户会下到一个跑不起来的包），所以先核齐三个资产。
      - name: Verify all platform assets present
        shell: bash
        run: |
          missing=()
          [ -s dist/MDCx-aarch64.dmg ] || missing+=("dist/MDCx-aarch64.dmg")
          [ -s dist/MDCx.exe ] || missing+=("dist/MDCx.exe")
          [ -s dist/MDCx ] || missing+=("dist/MDCx")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::产物缺失或为空：${missing[*]}。不发半成品 Release。"
            exit 1
          fi
          ls -l dist

      # changelog 正文**落盘**，不回 step output、不进 action 的 `body` 输入。
      # 根因：JS action 的每个 `with:` 输入都会被 runner 变成一个 `INPUT_*` 环境变量，
      # 而 Linux 对单个环境变量有 128 KiB 硬上限（MAX_ARG_STRLEN）。changelog 改按日期
      # 分段后单段可以很大（`## 2026-10-20` 那段就有 340+ KiB），一超限 runner 连 node
      # 进程都起不来，报 "An error occurred trying to start process '.../node24/bin/node'
      # ... Argument list too long"，publish-release 在第一个 Create Release 就崩，
      # 而三个平台的包此时已经传上去（半成品 Release）。详见「Publish release notes」。
      - name: Extract current changelog
        id: changelog
        shell: bash
        run: |
          tag="${{ steps.metadata.outputs.tag }}"
          version_name=$(grep -oE 'VERSION_NAME[[:space:]]*=[[:space:]]*"[^"]+"' mdcx/consts.py | grep -oE '"[^"]+"' | tr -d '"')
          if [ ! -s docs/Changelog.md ] || [ -z "$version_name" ]; then
            echo "::error::无法读取当前版本 changelog。"
            exit 1
          fi
          # v3.0 起 changelog 改按**日期**分段（`## YYYY-MM-DD`），版本号不再进标题、
          # 固定为 v3.0，故这里按 tag（纯数字 YYYYMMDD）折出的日期找对应段。
          date_str="${tag:0:4}-${tag:4:2}-${tag:6:2}"
          if ! grep -Eq "^## ${date_str}( |$)" docs/Changelog.md; then
            echo "::error::changelog 中缺少 ${date_str}（版本 ${version_name}）区段。"
            exit 1
          fi
          notes_file="release-notes.md"
          awk -v date="${date_str}" '$0 ~ "^## " date "( |$)" {found=1; print; next} found && /^## / {exit} found {print}' docs/Changelog.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::changelog 区段提取为空：$notes_file"
            exit 1
          fi
          echo "changelog 区段已落盘：$notes_file（$(wc -c <"$notes_file") 字节）"
          # 只回小字段（日期与文件路径），正文本身永远不进 step output。
          echo "date=$date_str" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create Release - macOS (Apple Silicon)
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          release_name: ${{ steps.metadata.outputs.name }}
          asset_name: MDCx-${{ steps.metadata.outputs.asset_version }}-${{ steps.metadata.outputs.tag }}-macos-aarch64-${{ github.sha }}.dmg
          file: dist/MDCx-aarch64.dmg
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          body: "完整变更日志见 docs/Changelog.md 的 ${{ steps.changelog.outputs.date }} 区段，正文由「Publish release notes」步骤写入。"
          tag: ${{ steps.metadata.outputs.tag }}

      - name: Create Release - Windows
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          release_name: ${{ steps.metadata.outputs.name }}
          asset_name: MDCx-${{ steps.metadata.outputs.asset_version }}-${{ steps.metadata.outputs.tag }}-windows-x86_64-${{ github.sha }}.exe
          file: dist/MDCx.exe
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          body: "完整变更日志见 docs/Changelog.md 的 ${{ steps.changelog.outputs.date }} 区段，正文由「Publish release notes」步骤写入。"
          tag: ${{ steps.metadata.outputs.tag }}

      - name: Create Release - Linux
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          release_name: ${{ steps.metadata.outputs.name }}
          asset_name: MDCx-${{ steps.metadata.outputs.asset_version }}-${{ steps.metadata.outputs.tag }}-linux-x86_64-${{ github.sha }}
          file: dist/MDCx
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          body: "完整变更日志见 docs/Changelog.md 的 ${{ steps.changelog.outputs.date }} 区段，正文由「Publish release notes」步骤写入。"
          tag: ${{ steps.metadata.outputs.tag }}

      # Release 正文（changelog 区段）必须走文件，不能走 action 的 `body` 输入。
      # 根因：JS action 的每个 `with:` 输入都会被 runner 变成一个 `INPUT_*` 环境变量，
      # 而 Linux 对单个环境变量有 128 KiB 硬上限（MAX_ARG_STRLEN）。changelog 改按日期
      # 分段后单段可以很大（`## 2026-10-20` 那段 340+ KiB），一超限 runner 连 node 进程
      # 都起不来，报 "An error occurred trying to start process '.../node24/bin/node' ...
      # Argument list too long"，publish-release 在第一个 Create Release 就崩——而此时三个
      # 平台的包已经传上去，留下的是一条没有正文的半成品 Release。
      # 改法：changelog 落盘成 release-notes.md（见「Extract current changelog」），
      # 正文用 `gh release edit --notes-file` 写——gh 是 GitHub-hosted runner 自带的
      # GitHub CLI，正文走文件与 HTTP 请求体，不受命令行长度限制。
      # 放在三个 Create Release **之后**：svenstaro 每次都会用 `body` 覆盖正文，
      # 提前写会被它抹掉。
      - name: Publish release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.name }}
          RELEASE_DATE: ${{ steps.changelog.outputs.date }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::未找到 gh（GitHub CLI），无法写入 Release 正文。"
            exit 1
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::Release 正文文件缺失或为空：$NOTES_FILE"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' 不存在，前面的 Create Release 步骤应已创建它。"
            exit 1
          fi
          # GitHub 对 Release 正文另有 **125,000 字符**硬上限，超了 API 直接 422
          # "body is too long"，正文一个字都写不进去。变更日志按日期分段后单段可以
          # 远超它（`## 2026-10-20` 那段近 30 万字符），故按行截到 120,000 字符
          # （留出下面那段提示的余量），并注明完整内容在哪。
          body_file="$NOTES_FILE"
          if command -v python3 >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/truncate_notes.py" <<'PY'
          import pathlib
          import sys

          src = pathlib.Path(sys.argv[1])
          date = sys.argv[2]
          LIMIT = 120_000
          FOOTER = (
              "\n\n---\n\n"
              "> Release notes truncated to fit GitHub's 125,000-character limit; "
              f"the complete version is in the `## {date}` section of `docs/Changelog.md` "
              "in the repository.\n"
          )

          text = src.read_text(encoding="utf-8")
          if len(text) <= LIMIT:
              print(src)
          else:
              head = text[:LIMIT]
              cut = head.rfind("\n")
              if cut > 0:
                  head = head[:cut]
              out = src.with_name("release-body.md")
              out.write_text(head.rstrip() + FOOTER, encoding="utf-8")
              print(
                  f"changelog 区段 {date} 共 {len(text)} 字符，超过 {LIMIT} 字符上限，"
                  f"已截断为 {len(head)} 字符并写入 {out}",
                  file=sys.stderr,
              )
              print(out)
          PY
            body_file="$(python3 "$RUNNER_TEMP/truncate_notes.py" "$NOTES_FILE" "$RELEASE_DATE")"
          else
            echo "::warning::未找到 python3，跳过正文截断；若正文超过 125,000 字符，写入会被 API 拒绝。"
          fi
          echo "写入 Release 正文：$body_file（$(wc -c <"$body_file") 字节）"
          # 预发布状态显式写一次：重跑同 tag 时可能与上次的状态不一致（gh 的
          # --prerelease 不传就不改，传 false 才显式置回正式版）。
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file "$body_file" --prerelease
          else
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file "$body_file" --prerelease=false
          fi
