name: Build and Release Python3.15

# Python 3.15 一体包构建流程（macOS ARM64 / Windows x86_64 / Linux x86_64）。
#
# 与 `build-py314.yml` 的分工（2026-10-21 起）：
#   - `build-py314.yml` **原样保留**，仍是唯一的正式发版路径（监听 tag `2*`、创建 Release）；
#   - 本流程只负责「用 Python 3.15 把三个平台的包编出来」，产物以 artifact 上传，
#     **不创建、也不覆盖 Release**。两条流程共用同一套纯数字 tag 命名空间且都按
#     `overwrite: true` 覆盖资产，同时发版会互相把对方的包刷掉、把同一条 release 的
#     `created_at` 顶到列表第一条，客户端虽然只按 tag 最大值判断更新，但用户会下到
#     错版本的一体包。等 3.15 全平台验证通过、决定把发版职责挪过来时，再删掉这段注释
#     并按 build-py314.yml 的 publish-release 结构补上。
#
# 3.15 专属三处（与 3.14 流程同款，口径一致）：
#   1. `UV_PYTHON: "3.15"` + `python-version: "3.15"`：仓库无 .python-version，
#      UV_PYTHON 兜住 setup-python 之外的 uv 调用（uv 会自行下载满足 requires-python
#      的最新解释器，那恰好就是 3.15，缺 cp315 wheel 的包会退回源码编译）；
#   2. 构建前 `sys.version_info[:2] == (3, 15)` 断言：防 uv 悄悄挑到别的解释器，
#      编出来的还是 3.14；
#   3. `uv sync --locked` + PyYAML 的 cp314 wheel 顶替（见「Install locked dependencies」）。
#
# PyYAML 至今没有 cp315 wheel（6.0.3 只发到 cp314），3.15 下 `uv sync` 会退回源码编译：
# Windows runner 缺 MSVC 头文件、Linux/macOS 也要编译器链。统一改用 cp314 wheel 顶替：
# 官方 wheel 里 `_yaml` 只是可选的 C 加速，缺它时 PyYAML 会自动退回纯 Python 实现
# （实测 `__with_libyaml__ = False`，safe_load/dump 行为与加速版一致），构建与使用都不受影响。
# 等 PyYAML 出了 cp315 wheel，删掉「Install locked dependencies」里的两行兼容代码即可。
#
# artifact 名统一带 `mdcx315-` 前缀：与 build-py314.yml 的 `mdcx-*` 区分开，
# 两条流程并行跑时不会互相覆盖同名 artifact。

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 显式锁定 3.15：仓库无 .python-version，UV_PYTHON 兜住 setup-python 之外的 uv 调用
  UV_PYTHON: "3.15"
  # 3.15 下 PyYAML 只能靠 cp314 wheel 顶替（见文件头说明），uv run 默认的隐式 sync
  # 会把已装好的 pyyaml 判定为「需重新安装」并再次失败。依赖统一在
  # 「Install locked dependencies」里显式 sync 一次，之后所有 uv run 都不再自动同步。
  UV_NO_SYNC: "1"

permissions:
  # 本流程不发 Release，只要读仓库内容。
  contents: read

on:
  # 只允许手动触发：发版（tag `2*` → Release）仍归 build-py314.yml，
  # 两条流程同时发版会互相覆盖同一条 release 的资产。
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（留空则自动取 mdcx/consts.py 的 LOCAL_VERSION，纯数字 YYYYMMDD）"
        required: false
        default: ""

concurrency:
  # 同一分支的多个 run 排队执行，不取消正在构建的 run。
  group: build-py315-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # https://github.com/actions/runner/issues/1985#issuecomment-1573518052
      - name: Set matrix
        id: set-matrix
        run: |
          items=()

          # 与 build-py314.yml 同矩阵：macOS 只剩 Apple Silicon 一条腿（macOS 已放弃
          # x86_64 架构），Windows 走 windows-2025，Linux 走 ubuntu-latest。
          items+=('{"build": "macos", "os": "macos-latest", "arch": "aarch64"}')
          items+=('{"build": "windows", "os": "windows-2025", "arch": "x86_64"}')
          items+=('{"build": "linux", "os": "ubuntu-latest", "arch": "x86_64"}')

          # 合并items到json数组
          matrix="matrix=["
          for ((i=0; i<${#items[@]}; i++)); do
            matrix+=" ${items[i]}"
            if [ $i -ne $(( ${#items[@]} - 1 )) ]; then
              matrix+=","
            fi
          done
          matrix+="]"

          # 输出matrix到GITHUB_OUTPUT
          echo $matrix >> $GITHUB_OUTPUT

  build-app:
    needs: init-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 某个平台 runner/依赖突然翻车时不阻塞其余平台；本流程不发 Release，
    # 产物核对由各平台自己的上传步骤负责（缺产物即该平台失败）。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.init-matrix.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Resolve build version
        id: build-version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="$DISPATCH_TAG"
          # 手动触发且没填版本号时，取 consts.py 的 LOCAL_VERSION（纯数字 YYYYMMDD）。
          if [ -z "$tag" ]; then
            tag=$(grep -oE 'LOCAL_VERSION[[:space:]]*=[[:space:]]*[0-9]+' mdcx/consts.py | grep -oE '[0-9]+')
          fi
          if ! [[ "$tag" =~ ^[0-9]+$ ]]; then
            echo "::error::版本号必须是纯数字 YYYYMMDD，当前为 '$tag'。请检查 mdcx/consts.py 的 LOCAL_VERSION 或手动输入。"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "Set up Python 3.15"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          activate-environment: true

      # 3.15 构建最容易被忽略的坑：uv 悄悄挑了别的解释器，编出来的还是 3.14。
      # 用 PATH 上的 python 断言（不能用 uv run：那会先隐式 sync，把下面 --locked 的严格性架空）。
      - name: Verify Python 3.15 in use
        shell: bash
        run: |
          python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 15), f"expected 3.15, got {sys.version_info[:2]}"'

      - name: Install Linux system dependencies
        if: ${{ matrix.build == 'linux' }}
        run: >
          sudo apt-get update -y && sudo apt-get install -y
          libglib2.0-0 libegl1 libgl1 libfontconfig1
          libqt6core6 libqt6gui6 libqt6widgets6 libqt6network6 libqt6xml6
          libdbus-1-3 libxkbcommon0 libopengl0
          libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
          pkg-config libavformat-dev libavcodec-dev libavdevice-dev
          libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
          libxml2-dev libxslt1-dev libxslt-dev python3-dev zlib1g-dev gcc

      # 3.15 特有的两处兼容处理：
      #   1. `uv sync --locked` 失败时回退重新解析（只影响本次 CI 的临时工作树，
      #      检出为干净树，不改仓库 uv.lock）——写死版本若无 cp315 wheel 仍会失败，
      #      那属于需要升级依赖的硬阻塞（见 tests/test_py314_dependency_floors.py）；
      #   2. PyYAML 至今没有 cp315 wheel（6.0.3 只发到 cp314），3.15 下只能源码编译。
      #      这里用 cp314 wheel 顶替：`_yaml` 只是可选的 C 加速，缺它时 PyYAML 自动
      #      退回纯 Python 实现，功能一致。等 PyYAML 出了 cp315 wheel，把
      #      `--no-install-package pyyaml` 与下面那条 uv pip install 一起删掉即可。
      - name: Install locked dependencies
        shell: bash
        run: |
          if ! uv sync --locked --all-extras --dev --no-install-package pyyaml; then
            echo "::warning::uv sync --locked 在 Python 3.15 下失败，回退到重新解析依赖。写死版本若无 cp315 wheel，仍会失败——那属于需要升级依赖的硬阻塞。"
            uv sync --all-extras --dev --no-install-package pyyaml
          fi
          VENV_PY="$PWD/.venv/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY="$PWD/.venv/Scripts/python.exe"
          uv pip install --python "$VENV_PY" --python-version 3.14 --only-binary=:all: "pyyaml==6.0.3"
          "$VENV_PY" -c "import yaml; print('pyyaml', yaml.__version__, 'libyaml', yaml.__with_libyaml__)"

      # 超分工具一体包：Windows/Linux 打包期内嵌（macOS 不内嵌，保持首次使用按需下载）。
      # 缓存由 update-sr-tools.yml 定期刷新；命中时 fetch 脚本幂等跳过下载，未命中则直接拉取。
      - name: Restore SR tools cache (Windows/Linux)
        if: ${{ matrix.build == 'windows' || matrix.build == 'linux' }}
        uses: actions/cache@v6
        with:
          path: build/sr_tools
          key: sr-tools-${{ matrix.build }}

      - name: Fetch SR tools (Windows/Linux)
        if: ${{ matrix.build == 'windows' || matrix.build == 'linux' }}
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python -m scripts.fetch_sr_tools --platform ${{ matrix.build }}

      - name: Build macOS app - macOS
        if: ${{ matrix.build == 'macos' }}
        run: |
          uv run scripts/build.py --create-dmg --version "${{ steps.build-version.outputs.tag }}" --debug
          mv dist/MDCx.dmg "dist/MDCx-${{ matrix.arch }}.dmg"

      - name: Build Windows app - Windows
        if: ${{ matrix.build == 'windows' }}
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --version "${{ steps.build-version.outputs.tag }}" --debug

      - name: Build Linux app - Linux
        if: ${{ matrix.build == 'linux' }}
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --version "${{ steps.build-version.outputs.tag }}" --debug

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'macos' }}
        with:
          name: mdcx315-macos-${{ matrix.arch }}
          path: dist/MDCx-${{ matrix.arch }}.dmg

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'windows' }}
        with:
          name: mdcx315-windows-${{ matrix.arch }}
          path: dist/MDCx.exe

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.build == 'linux' }}
        with:
          name: mdcx315-linux-${{ matrix.arch }}
          path: dist/MDCx
